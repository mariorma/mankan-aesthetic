<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0d" />
    <meta name="robots" content="noindex" />
    <title>这一页没有 — 敛色</title>
    <style>
      html { background: #0b0d0d; color: #d8d0c2; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
        background: radial-gradient(40vmax 40vmax at 50% 38%, rgba(185, 138, 68, 0.22), transparent 70%);
      }
      main { text-align: center; padding: 2rem; }
      .mark { font-size: clamp(5rem, 18vw, 11rem); line-height: 1; margin: 0; letter-spacing: 0.08em; color: #ece7de; }
      p { margin: 1.2rem 0 0; font-size: 1.05rem; color: #a59d90; }
      a { color: #ece7de; text-underline-offset: 0.3em; }
    </style>
  </head>
  <body>
    <main>
      <h1 class="mark">敛色</h1>
      <p>这一页没有。灯没开在这里。</p>
      <p><a id="home" href="/">回到首页</a> · <a id="daily" href="/daily/">去日更</a></p>
    </main>
    <script>
      (function () {
        var seg = location.pathname.split("/").filter(Boolean)[0];
        var base = location.hostname.slice(-10) === ".github.io" && seg ? "/" + seg + "/" : "/";
        document.getElementById("home").href = base;
        document.getElementById("daily").href = base + "daily/";
      })();
    </script>
  </body>
</html>
